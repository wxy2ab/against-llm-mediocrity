<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Against LLM Mediocrity studies how to turn local model capability into stable task value."
    />
    <title>Against LLM Mediocrity</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Resolve the theme before first paint (same rule as src/main.ts). -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("alm-theme");
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <style>
      html {
        background: #f6f5f1;
      }
      html[data-theme="dark"] {
        background: #0f1114;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
